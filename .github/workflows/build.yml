name: Build PUNK Nexus

# Every push builds the Windows executable. Pushes to a branch leave it as a workflow artifact you
# can download from the run; pushes to main additionally publish it as a GitHub Release.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'manifest/**'      # the catalog is read at runtime from the repo — it needs no new build
      - 'reports/**'       # ditto for the virus scan reports, which CI rewrites on a schedule
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # required to create Releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Computed before the build, not after, because the version has to go INTO the binary. A
      # client that reports 0.1.0 while releases are tagged v2026.08.09.17 cannot tell whether it
      # is out of date -- the two are not comparable, so an updater has nothing to decide on.
      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $version = "{0}.{1}" -f (Get-Date -Format 'yyyy.MM.dd'), '${{ github.run_number }}'
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "building as $version"

      - name: Restore
        run: dotnet restore src/PunkNexus/PunkNexus.csproj

      # Self-contained: users double-click the exe with no .NET runtime installed. Trimming stays
      # off because Avalonia resolves XAML types by name at runtime.
      - name: Publish (win-x64, single file)
        run: >
          dotnet publish src/PunkNexus/PunkNexus.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}
          -o publish

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path publish/PunkNexus.exe -DestinationPath dist/PunkNexus-win-x64.zip -Force
          Copy-Item publish/PunkNexus.exe dist/PunkNexus.exe -Force
          # The updater refuses to install anything whose hash it cannot confirm, so the release has
          # to carry one for every asset it might fetch. Same reasoning the client applies to every
          # mod it installs; the updater replaces the client itself, which is the last place to make
          # an exception.
          #
          # BOTH are published, and the exe pair must stay: clients built before the zip path
          # existed look for PunkNexus.exe and PunkNexus.exe.sha256 by name, and a release without
          # them is one those clients log as unusable and skip -- permanently, on every launch.
          # Dropping either is how you strand everyone who has not updated yet.
          $hash = (Get-FileHash dist/PunkNexus.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PunkNexus.exe" | Out-File -FilePath dist/PunkNexus.exe.sha256 -Encoding ascii -NoNewline
          Write-Host "sha256 (exe) $hash"

          # Preferred by current clients: same binary, well under half the bytes, which on a slow
          # connection is the difference between an update that completes and one that times out.
          $zipHash = (Get-FileHash dist/PunkNexus-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  PunkNexus-win-x64.zip" |
            Out-File -FilePath dist/PunkNexus-win-x64.zip.sha256 -Encoding ascii -NoNewline
          Write-Host "sha256 (zip) $zipHash"
          Get-ChildItem dist | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PunkNexus-win-x64
          path: dist/PunkNexus.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PUNK Nexus ${{ steps.ver.outputs.tag }}
          files: |
            dist/PunkNexus.exe
            dist/PunkNexus.exe.sha256
            dist/PunkNexus-win-x64.zip
            dist/PunkNexus-win-x64.zip.sha256
          generate_release_notes: true
          append_body: true
          body: |
            Download **PunkNexus.exe** and run it — no installer and no .NET runtime needed.

            On first launch it finds your PUNK install (or lets you pick it), installs BepInEx, and
            manages mods from there.
